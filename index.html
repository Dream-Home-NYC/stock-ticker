<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamHome Market Command - Standalone Edition</title>
    <style>
        :root { --bg: #000; --panel: #1a1a1a; --text: #fff; --border: #333; --up: #00ff00; --down: #ff4444; --news: #00d4ff; --emerald: #50fa7b; --crimson: #ff5555; }
        [data-theme="light"] { --bg: #fff; --panel: #f4f4f4; --text: #000; --border: #ccc; }
        
        body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .ticker-section { width: 100%; overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--border); background: var(--bg); cursor: pointer; display: flex; align-items: center; transition: background 0.5s ease; flex-shrink: 0; }
        #top-banner { padding: 6px 0; border-bottom: 2px solid #444; height: 40px; }
        #mid-banner { padding: 10px 0; border-bottom: 2px solid var(--border); height: 50px; }
        #news-banner { padding: 6px 0; background: #050505; border-bottom: 2px solid var(--news); height: 40px; }

        #status-row {
            width: 100%;
            height: 45px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-shrink: 0;
        }

        #market-status-bar { 
            padding: 0 15px; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-weight: bold; 
            font-family: monospace; 
            font-size: 18px;
        }
        #live-date { color: var(--up); }
        #live-clock { color: var(--text); }
        
        .white-text { color: var(--text) !important; }
        .up { color: var(--up); } 
        .down { color: var(--down); }

        @keyframes pulse-breath-slow {
            0%, 100% { filter: drop-shadow(0 0 1px currentColor); opacity: 1; }
            50% { filter: drop-shadow(0 0 8px currentColor); opacity: 0.8; }
        }
        .breathing-slow { 
            animation: pulse-breath-slow 3s ease-in-out infinite; 
            text-decoration: underline !important;
            text-underline-offset: 6px;
            text-decoration-thickness: 1px;
        }

        @keyframes pulse-breath-fast {
            0%, 100% { filter: drop-shadow(0 0 2px currentColor); opacity: 1; }
            50% { filter: drop-shadow(0 0 15px currentColor); opacity: 0.7; }
        }
        .breathing-fast { 
            animation: pulse-breath-fast 1.5s ease-in-out infinite; 
            text-decoration: underline !important;
            text-underline-offset: 6px;
            text-decoration-thickness: 2px;
        }

        .heat-emerald { color: #000 !important; background: var(--emerald); border: 2px solid #fff; font-weight: 900; animation: none; }
        .heat-crimson { color: #fff !important; background: var(--crimson); border: 2px solid #fff; font-weight: 900; animation: none; }
        .heat-emerald .white-text, .heat-emerald .up { color: #000 !important; }
        .heat-crimson .white-text, .heat-crimson .down { color: #fff !important; }

        .scroller { display: inline-block; padding-left: 100%; animation: scroll linear infinite; font-weight: bold; line-height: 1.2; }
        .ticker-section:hover .scroller { animation-play-state: paused !important; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        
        .stock-item { margin-right: 60px; display: inline-block; vertical-align: middle; padding: 2px 8px; border-radius: 4px; }
        .news-item { margin-right: 100px; color: var(--news); font-style: italic; display: inline-block; }
        .event-alert { color: #000; font-weight: 900; background: #f1fa8c; padding: 0 10px; border-radius: 4px; margin-right: 50px; display: inline-flex; align-items: center; border: 1px solid #fff; }
        
        #controls { padding: 15px; flex-grow: 1; transition: opacity 0.5s; opacity: 1; overflow-y: auto; }
        .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 20px; }
        
        .control-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: #aaa; }
        
        input, button { padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        button { cursor: pointer; font-weight: bold; background: #2962ff; color: #fff; border: none; }
        button:hover { filter: brightness(1.2); }
        
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .open-dot { background: var(--up); box-shadow: 0 0 8px var(--up); }
        .closed-dot { background: var(--down); }
        
        #fetch-status { font-size: 10px; color: #ffaa00; margin-left: 10px; display: none; }

        /* Brand Container Refined */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            width: 100%;
        }
        .app-logo {
            height: 80px;
            border-radius: 12px;
            border: 2px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }
        .app-logo:hover { transform: scale(1.05); }

        .brand-text-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-name {
            font-size: 48px;
            font-weight: 800;
            font-family: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(to right, #afff9a, #008000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            line-height: 1;
            filter: drop-shadow(0 2px 10px rgba(0, 128, 0, 0.2));
            white-space: pre;
        }

        .app-subtitle {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-top: 8px; /* Increased from -2px to 8px for more space */
            margin-left: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .tip-box {
            font-size: 13px;
            color: var(--text);
            opacity: 0.8;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--news);
            max-width: 300px;
            line-height: 1.4;
            margin-left: auto;
        }
    </style>
</head>
<body data-theme="dark">

<div id="top-banner" class="ticker-section">
    <div id="macro-scroller" class="scroller">Loading Indices...</div>
</div>

<div id="mid-banner" class="ticker-section">
    <div id="portfolio-scroller" class="scroller">Syncing Stocks...</div>
</div>

<div id="news-banner" class="ticker-section">
    <div id="news-scroller" class="scroller">Fetching Global News...</div>
</div>

<div id="status-row">
    <div id="market-status-bar">
        <span id="live-date">--/--/----</span>
        <span id="live-clock">00:00:00</span>
        <div id="status-indicator" class="status-dot closed-dot"></div>
        <span id="status-text">CLOSED</span>
        <span id="countdown-wrap" style="margin-left:5px">
            <span id="cd-text" class="cd-label" style="color:var(--news)"></span> 
            <span id="cd-time" class="cd-timer" style="color:var(--up)"></span>
        </span>
        <button id="mute-toggle" onclick="toggleMute()" style="padding:2px 6px; font-size:12px; background:#444; border:none; cursor:pointer;">🔊</button>
        <span id="fetch-status">📡 SYNCING...</span>
    </div>
</div>

<div id="controls">
    <div class="card">
        <!-- Settings Row -->
        <div class="control-row">
            <div class="control-group">SYMBOL <input type="text" id="new-stock" placeholder="e.g. NVDA" style="width:70px"></div>
            <button onclick="addStock()" style="margin-top:12px">ADD</button>
            <div class="control-group">FONT <input type="number" id="f-size" value="22" style="width:40px" oninput="updateUI(true)"></div>
            <div class="control-group">MACRO <input type="number" id="speed-macro" value="50" style="width:40px" oninput="updateUI(true)"></div>
            <div class="control-group">STOCKS <input type="number" id="speed-stocks" value="30" style="width:40px" oninput="updateUI(true)"></div>
            <div class="control-group">NEWS <input type="number" id="speed-news" value="80" style="width:40px" oninput="updateUI(true)"></div>
            
            <div style="display: flex; align-items: center; gap: 10px; margin-top:12px;">
                <button id="bold-btn" class="toggle-btn" onclick="toggleBold()">BOLD</button>
                <button onclick="toggleTheme()" style="background:#555">🌓 THEME</button>
                <button onclick="refreshAll()" style="background:#444; font-size:10px">🔄 REFRESH</button>
                <span id="last-sync" style="font-size:11px; color:#888; font-family: monospace;">Sync: --:--:--</span>
            </div>
        </div>

        <!-- Brand and Tip Row -->
        <div class="brand-container">
            <img src="logo.jpg" alt="UpTick Logo" class="app-logo">
            <div class="brand-text-wrapper">
                <div class="app-name"> UpTick</div>
                <div class="app-subtitle">Market Monitor V3.8</div>
            </div>
            <div class="tip-box">
                💡 <b>Tip:</b> Hover mouse over any banner to pause scrolling for closer inspection.
            </div>
        </div>

        <div id="active-list" style="margin-top:0px"></div>
    </div>
</div>

<script>
    const PROXY_ALLORIGINS = 'https://api.allorigins.win/get?url=';
    const PROXY_CORSPROXY = 'https://corsproxy.io/?';

    let userStocks = JSON.parse(localStorage.getItem('stocks')) || ['NVDA', 'AAPL', 'TSLA', 'AMD'];
    let isBold = localStorage.getItem('tickerBold') === 'true', isMuted = localStorage.getItem('tickerMuted') === 'true';

    function resetInactivityTimer() {
        const c = document.getElementById('controls');
        c.style.opacity = '1';
        c.style.pointerEvents = 'auto';
        clearTimeout(window.hideTimer);
        window.hideTimer = setTimeout(() => {
            c.style.opacity = '0';
            c.style.pointerEvents = 'none';
        }, 15000);
    }
    ['mousemove', 'mousedown', 'keypress', 'touchstart'].forEach(evt => document.addEventListener(evt, resetInactivityTimer, {passive: true}));
    resetInactivityTimer();

    function getNextMarketEvent(now) {
        let checkDate = new Date(now);
        for(let i=0; i<7; i++) {
            const day = checkDate.getDay(), isWeekend = (day === 0 || day === 6);
            const openT = new Date(checkDate).setHours(9, 30, 0, 0), closeT = new Date(checkDate).setHours(16, 0, 0, 0);
            if (!isWeekend) {
                if (now < openT) return { type: 'open', time: openT };
                if (now < closeT) return { type: 'close', time: closeT };
            }
            checkDate.setDate(checkDate.getDate() + 1); checkDate.setHours(9, 30, 0, 0);
        }
    }

    function updateClock() {
        const now = new Date();
        const estOptions = { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' };
        const nyParts = new Intl.DateTimeFormat('en-US', estOptions).formatToParts(now);
        document.getElementById('live-date').innerText = `${nyParts.find(p=>p.type==='month').value}/${nyParts.find(p=>p.type==='day').value}/${nyParts.find(p=>p.type==='year').value}`;
        document.getElementById('live-clock').innerText = `${nyParts.find(p=>p.type==='hour').value}:${nyParts.find(p=>p.type==='minute').value}:${nyParts.find(p=>p.type==='second').value}`;

        const event = getNextMarketEvent(now), diff = Math.floor((event.time - now) / 1000);
        const open = event.type === 'close';
        document.getElementById('status-indicator').className = `status-dot ${open ? 'open-dot' : 'closed-dot'}`;
        document.getElementById('status-text').innerText = open ? 'OPEN' : 'CLOSED';
        document.getElementById('status-text').style.color = open ? 'var(--up)' : 'var(--down)';
        document.getElementById('cd-text').innerText = open ? 'Closes in' : 'Opens in';
        document.getElementById('cd-time').innerText = `${Math.floor(diff/3600)}h ${Math.floor((diff%3600)/60)}m ${diff%60}s`;
    }

    const macroList = [
        { sym: '^DJI', name: 'DOW' }, 
        { sym: '^IXIC', name: 'NASDAQ' }, 
        { sym: '^GSPC', name: 'S&P 500' }, 
        { sym: 'GC=F', name: 'GOLD' }, 
        { sym: 'CL=F', name: 'OIL' }, 
        { sym: 'BTC-USD', name: 'BTC' },
        { sym: 'ETH-USD', name: 'ETH' }
    ];
    
    async function fetchYahoo(symbol) {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1m&range=1d`;
        
        try {
            const res = await fetch(`${PROXY_CORSPROXY}${encodeURIComponent(targetUrl)}`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const meta = data.chart.result[0].meta;
            return {
                price: meta.regularMarketPrice,
                change: meta.regularMarketPrice - meta.previousClose,
                percent: ((meta.regularMarketPrice - meta.previousClose) / meta.previousClose) * 100
            };
        } catch (e) {
            try {
                const res = await fetch(`${PROXY_ALLORIGINS}${encodeURIComponent(targetUrl)}`);
                const json = await res.json();
                const raw = typeof json.contents === 'string' ? JSON.parse(json.contents) : json.contents;
                const meta = raw.chart.result[0].meta;
                return {
                    price: meta.regularMarketPrice,
                    change: meta.regularMarketPrice - meta.previousClose,
                    percent: ((meta.regularMarketPrice - meta.previousClose) / meta.previousClose) * 100
                };
            } catch (e2) {
                console.error(`Failed to sync ${symbol}`);
                return null;
            }
        }
    }

    async function refreshAll() {
        const statusEl = document.getElementById('fetch-status');
        statusEl.style.display = 'inline';
        statusEl.innerText = '📡 SYNCING...';
        
        let tH = ''; 
        for (let i of macroList) { 
            const d = await fetchYahoo(i.sym); 
            if (d) tH += formatItem(i.name, d, true); 
        }
        if (tH) document.getElementById('macro-scroller').innerHTML = tH;

        let mH = ''; 
        for (let s of userStocks) { 
            const d = await fetchYahoo(s); 
            if (d) mH += formatItem(s, d, false); 
        }
        if (mH) document.getElementById('portfolio-scroller').innerHTML = mH;

        try {
            const newsUrl = 'https://finance.yahoo.com/news/rssindex';
            const res = await fetch(`${PROXY_CORSPROXY}${encodeURIComponent(newsUrl)}`);
            const text = await res.text();
            const xml = new DOMParser().parseFromString(text, "text/xml");
            const items = Array.from(xml.querySelectorAll("item")).slice(0, 15);
            let newsH = items.map(item => `<span class="news-item">NEWS: ${item.querySelector("title").textContent.toUpperCase()}</span>`).join('');
            if (newsH) document.getElementById('news-scroller').innerHTML = newsH;
        } catch (e) { 
            console.log("News sync failed"); 
        }
        
        document.getElementById('last-sync').innerText = `Sync: ${new Date().toLocaleTimeString()}`;
        statusEl.style.display = 'none';
        renderTags(); 
        updateUI(false);
    }

    function formatItem(label, d, isMacro) {
        const isUp = d.change >= 0;
        const colorClass = isUp ? 'up' : 'down';
        let cls = "";
        if (!isMacro) {
            if (Math.abs(d.percent) >= 5.0) cls = isUp ? "heat-emerald" : "heat-crimson";
            else if (Math.abs(d.percent) >= 3.5) cls = "breathing-fast";
            else if (Math.abs(d.percent) >= 2.0) cls = "breathing-slow";
        }
        return `<span class="stock-item ${cls}">
            <span class="white-text">${label}</span> 
            <span class="white-text">$${d.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span> 
            <span class="${colorClass}">${isUp?'+':''}${d.change.toFixed(2)} (${isUp?'+':''}${d.percent.toFixed(2)}%)</span>
        </span>`;
    }

    function updateUI(save) {
        const size = document.getElementById('f-size').value;
        document.querySelectorAll('.scroller').forEach(s => {
            s.style.fontSize = size + 'px'; 
            s.style.fontWeight = isBold ? 'bold' : 'normal';
            if (s.id === 'macro-scroller') s.style.animationDuration = document.getElementById('speed-macro').value + 's';
            if (s.id === 'portfolio-scroller') s.style.animationDuration = document.getElementById('speed-stocks').value + 's';
            if (s.id === 'news-scroller') s.style.animationDuration = document.getElementById('speed-news').value + 's';
        });
        document.getElementById('bold-btn').style.opacity = isBold ? '1' : '0.5';
        if (save) { 
            localStorage.setItem('tickerFontSize', size); 
            localStorage.setItem('speedMacro', document.getElementById('speed-macro').value); 
            localStorage.setItem('speedStocks', document.getElementById('speed-stocks').value); 
            localStorage.setItem('speedNews', document.getElementById('speed-news').value); 
            localStorage.setItem('tickerBold', isBold); 
        }
    }

    function toggleTheme() { 
        const t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; 
        document.body.setAttribute('data-theme', t); 
        localStorage.setItem('theme', t); 
    }
    
    function toggleMute() { 
        isMuted = !isMuted; 
        localStorage.setItem('tickerMuted', isMuted); 
        document.getElementById('mute-toggle').innerText = isMuted ? '🔇' : '🔊'; 
    }
    
    function toggleBold() { 
        isBold = !isBold; 
        updateUI(true); 
    }
    
    function addStock() { 
        const v = document.getElementById('new-stock').value.toUpperCase().trim(); 
        if (v && !userStocks.includes(v)) { 
            userStocks.push(v); 
            localStorage.setItem('stocks', JSON.stringify(userStocks)); 
            refreshAll(); 
            document.getElementById('new-stock').value = ''; 
        } 
    }
    
    function removeStock(s) { 
        userStocks = userStocks.filter(x => x !== s); 
        localStorage.setItem('stocks', JSON.stringify(userStocks)); 
        refreshAll(); 
    }
    
    function renderTags() { 
        document.getElementById('active-list').innerHTML = userStocks.map(s => `
            <span style="background:var(--border); padding:5px 10px; margin:5px; border-radius:4px; display:inline-block;">
                ${s} <b onclick="removeStock('${s}')" style="cursor:pointer;color:var(--down);margin-left:5px">×</b>
            </span>
        `).join(''); 
    }

    document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    setInterval(updateClock, 1000);
    setInterval(refreshAll, 60000);
    updateClock();
    refreshAll();
</script>
</body>
</html>
